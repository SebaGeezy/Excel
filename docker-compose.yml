version: "3.9"

services:
  backend_excel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_excel
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=excel_db
      - DB_USER=root
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "sleep 15 && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  frontend_excel:
    build:
      context: ./excel-frontend
      dockerfile: Dockerfile
    container_name: frontend_excel
    ports:
      - "8080:80"
    depends_on:
      - backend_excel
    restart: unless-stopped
    volumes:
      - ./excel-frontend/dist:/usr/share/nginx/html
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: excel_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "-ppassword"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
